<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyBuzz - Log In</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom Style Sheet -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="auth-page light-theme">
    <div class="auth-container">
        <div class="auth-card card">
            <div class="auth-header">
                <div class="app-logo">
                    <i class="fa-solid fa-bus-simple"></i>
                </div>
                <h1>MyBuzz</h1>
                <p class="subtitle">Nagpur &harr; Gondia Route Tracker</p>
            </div>

            <!-- Role Selector Tabs -->
            <div class="role-selector-tabs">
                <button type="button" id="role-tab-passenger" class="role-tab {% if role == 'passenger' %}active{% endif %}" data-role="passenger">
                    <i class="fa-solid fa-user"></i> Passenger
                </button>
                <button type="button" id="role-tab-driver" class="role-tab {% if role == 'driver' %}active{% endif %}" data-role="driver">
                    <i class="fa-solid fa-user-tie"></i> Conductor/Driver
                </button>
            </div>

            <form id="login-form" class="auth-form">
                <!-- Hidden input for role -->
                <input type="hidden" id="login-role" value="{{ role }}">

                <div class="auth-form-badge">
                    <i class="fa-solid fa-shield-halved"></i> <span id="auth-portal-title">Passenger Access</span>
                </div>

                <div class="error-msg" id="error-message">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span>Incorrect username or password.</span>
                </div>

                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-user" id="username-icon"></i>
                        <input type="text" id="username" placeholder="Enter your username" required autocomplete="username">
                    </div>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="password" placeholder="Enter your password" required autocomplete="current-password">
                    </div>
                    <div class="forgot-pwd-link-container" style="text-align: right; margin-top: 6px;">
                        <a href="#" id="forgot-password-link" style="font-size: 0.8rem; font-weight: 600; color: var(--text-dim); text-decoration: none;">Forgot Password?</a>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="login-submit-btn">
                    <span>Log In</span>
                    <i class="fa-solid fa-arrow-right-to-bracket"></i>
                </button>
            </form>

            <form id="forgot-password-form" class="auth-form" style="display: none;">
                <div class="auth-form-badge">
                    <i class="fa-solid fa-key"></i> <span>Reset Password</span>
                </div>

                <div class="error-msg" id="forgot-error-message">
                    <i class="fa-solid fa-circle-exclamation"></i>
                    <span>Incorrect username or password.</span>
                </div>
                <div class="success-msg" id="forgot-success-message">
                    <i class="fa-solid fa-circle-check"></i>
                    <span>OTP sent successfully.</span>
                </div>

                <!-- Step 1: Send OTP -->
                <div id="forgot-step-1">
                    <div class="form-group">
                        <label for="forgot-email">Gmail ID</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-envelope"></i>
                            <input type="email" id="forgot-email" placeholder="Enter your registered Gmail ID">
                        </div>
                    </div>
                    <button type="button" class="btn btn-primary btn-block" id="btn-send-otp">
                        <span>Send OTP</span>
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>

                <!-- Step 2: Verify OTP & Reset Password -->
                <div id="forgot-step-2" style="display: none;">
                    <div class="form-group">
                        <label for="forgot-otp">Enter OTP</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-shield-halved"></i>
                            <input type="text" id="forgot-otp" placeholder="Enter 6-digit OTP">
                        </div>
                        <small style="display: block; font-size: 0.75rem; color: var(--text-muted); margin-top: 4px;">
                            Simulation: check server logs for the OTP.
                        </small>
                    </div>
                    <div class="form-group">
                        <label for="forgot-new-password">New Password</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock"></i>
                            <input type="password" id="forgot-new-password" placeholder="Min. 6 characters">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary btn-block" id="btn-reset-password">
                        <span>Reset Password</span>
                        <i class="fa-solid fa-circle-check"></i>
                    </button>
                </div>

                <div style="text-align: center; margin-top: 16px;">
                    <a href="#" id="back-to-login-link" style="font-size: 0.85rem; font-weight: 700; color: var(--accent-blue); text-decoration: none;"><i class="fa-solid fa-arrow-left"></i> Back to Log In</a>
                </div>
            </form>

            <div class="auth-footer">
                <p>New to MyBuzz? <a href="/register?role={{ role }}" id="register-link" class="text-link">Create an account</a></p>
            </div>
        </div>
    </div>

    <!-- Auth Logic -->
    <script src="{{ url_for('static', filename='js/auth.js') }}"></script>
</body>
</html>
